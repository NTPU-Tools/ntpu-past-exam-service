# Backend stack: a one-shot Alembic migration, then the Rust API.
#
#   docker compose --env-file .env up -d --build
#
# Set AUTH_COOKIE_SECURE=true when serving over HTTPS.

x-database: &database
  DATABASE_HOST: ${DATABASE_HOST}
  DATABASE_PORT: ${DATABASE_PORT:-5432}
  DATABASE_USERNAME: ${DATABASE_USERNAME}
  DATABASE_PASSWORD: ${DATABASE_PASSWORD}
  DATABASE: ${DATABASE}

services:
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["sh", "-c", "python -m alembic upgrade head && python -m alembic check"]
    environment:
      <<: *database
      DATABASE_DRIVER: ${DATABASE_DRIVER:-postgresql+psycopg}
    restart: "no"

  api:
    build:
      context: ./rust
      dockerfile: Dockerfile
      args:
        SOURCE_COMMIT: ${SOURCE_COMMIT:-unknown}
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *database
      PORT: 8080
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      R2_URL: ${R2_URL}
      R2_ACCESS_KEY: ${R2_ACCESS_KEY}
      R2_ACCESS_TOKEN: ${R2_ACCESS_TOKEN}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME}
      R2_FILE_PATH: ${R2_FILE_PATH}
      HASH_KEY: ${HASH_KEY}
      ORIGIN: ${ORIGIN:-}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      AWS_EMAIL_SENDER: ${AWS_EMAIL_SENDER:-}
      AWS_ACCESS_KEY: ${AWS_ACCESS_KEY:-}
      AWS_ACCESS_SECRET: ${AWS_ACCESS_SECRET:-}
      GOOGLE_SERVICE_CLIENT_ID: ${GOOGLE_SERVICE_CLIENT_ID:-}
      GOOGLE_SERVICE_SERCET: ${GOOGLE_SERVICE_SERCET:-}
      LOG_TAIL_SOURCE_KEY: ${LOG_TAIL_SOURCE_KEY:-}
      SERVICE_NAME: ${SERVICE_NAME:-local}
      RUST_LOG: ${RUST_LOG:-info}
    ports:
      - "${API_PORT:-8080}:8080"
    restart: unless-stopped
