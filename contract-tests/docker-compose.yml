# Isolated stack for the black-box contract suite.
#
#   docker compose -p pe-contract -f contract-tests/docker-compose.yml up -d --build --wait
#
# `schema` creates the database schema with the Rust migrator. Start the service
# under test on the host with contract-tests/contract.env, then run the tests.

name: pe-contract

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: past_exam_contract
      POSTGRES_USER: contract
      POSTGRES_PASSWORD: contract
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contract -d past_exam_contract"]
      interval: 2s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30

  minio:
    image: pgsty/silo:RELEASE.2026-08-06T00-00-00Z
    command: server /data
    environment:
      MINIO_ROOT_USER: contractadmin
      MINIO_ROOT_PASSWORD: contractadmin
    ports:
      - "127.0.0.1:59000:9000"
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "silo", "healthcheck", "ready"]
      interval: 2s
      timeout: 5s
      retries: 30

  minio-init:
    image: pgsty/silo:RELEASE.2026-08-06T00-00-00Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mcli alias set local http://minio:9000 contractadmin contractadmin &&
      mcli mb local/past-exam-contract --ignore-existing &&
      mcli anonymous set download local/past-exam-contract
      "

  schema:
    build:
      context: ../rust
      dockerfile: Dockerfile
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_USERNAME: contract
      DATABASE_PASSWORD: contract
      DATABASE: past_exam_contract
    command: ["migrate"]
    depends_on:
      postgres:
        condition: service_healthy
