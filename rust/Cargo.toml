[package]
name = "past-exam-service"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "past-exam-service"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["json", "multipart", "macros", "http1"] }
bcrypt = "0.17"
bytes = "1"
caseless = "0.2"
chrono = { version = "0.4", features = ["serde"] }
cookie = "0.18"
dotenvy = "0.15"
futures-util = "0.3"
hex = "0.4"
http-body-util = "0.1"
ipnet = "2"
jsonwebtoken = "9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
scraper = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "chrono", "macros", "migrate"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["catch-panic"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
unicode-general-category = "1"
url = "2"
uuid = { version = "1", features = ["v4"] }
opendal = { version = "0.54", default-features = false, features = ["services-s3"] }
aws-sdk-ses = "1"
redis = { version = "0.27", features = ["tokio-comp", "connection-manager", "script"] }
